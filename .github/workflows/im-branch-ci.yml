# Temporary lane for the IM light-mode work: runs the app checks on every push
# to its own branch, because ci.yml only listens to main and pull requests.
# Delete this file before the branch is merged.
name: IM light mode

on:
  push:
    branches: [feat/im-light-mode]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  NOTO_CJK_VERSION: 1:20230817+repack1-3
  NOTO_EMOJI_VERSION: v2.051
  DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
  TZ: Asia/Shanghai

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The tests draw text, and the harness wants these exact faces: the same
      # fonts ci.yml installs for the goldens.
      - name: Install the test fonts
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          apt-get download fonts-noto-cjk="$NOTO_CJK_VERSION" fonts-noto-cjk-extra="$NOTO_CJK_VERSION"
          for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" unpacked; done
          sudo install -Dm644 -t "$DSH_TEST_FONT_DIR" unpacked/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold,Light}.ttc
          curl -fsSL --retry 3 -o /tmp/NotoColorEmoji.ttf "https://raw.githubusercontent.com/googlefonts/noto-emoji/$NOTO_EMOJI_VERSION/fonts/NotoColorEmoji.ttf"
          sudo install -Dm644 /tmp/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf
      - name: Pub get
        run: flutter pub get --enforce-lockfile
      # The rc line already carries a few warnings in files this work does not
      # touch; they stay visible, but only errors fail this lane.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      # Only the area this branch touches: the whole suite runs in build-apk on
      # the same push, and its 20-minute pass is no use as a loop.
      - name: Test the light home
        run: flutter test --reporter expanded test/ui/im
