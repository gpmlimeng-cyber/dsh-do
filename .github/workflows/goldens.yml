name: goldens

# Regenerates the golden screenshots on a runner with Flutter, and hands them
# back as an artifact. Goldens are pictures of the interface: a person looks at
# the changed ones before they are committed.
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Fonts the golden tests render with
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Fetch packages
        run: flutter pub get
        working-directory: app

      - name: Regenerate the goldens this change touches
        run: flutter test --update-goldens test/bots/bots_golden_test.dart
        working-directory: app

      - name: Collect only the pictures that actually changed
        run: |
          git status --porcelain app/test || true
          git diff --stat -- app/test || true
          mkdir -p /tmp/goldens
          git diff --name-only -- app/test | while read -r file; do
            [ -f "$file" ] && cp --parents "$file" /tmp/goldens/
          done
          find /tmp/goldens -name '*.png' | wc -l

      - name: Bundle them with a list of what changed
        run: |
          git diff --name-only app/test > /tmp/goldens/CHANGED.txt
          git diff --stat app/test >> /tmp/goldens/CHANGED.txt
          cat /tmp/goldens/CHANGED.txt
          (cd /tmp/goldens && tar czf /tmp/goldens.tgz .)
          ls -la /tmp/goldens.tgz

      - name: Publish the bundle as a release asset
        # Artifact downloads go through Azure, which the phone cannot reach;
        # a release asset it can fetch with the same token it builds with.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="goldens-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          gh release create "$tag" /tmp/goldens.tgz \
            --title "Goldens ${GITHUB_SHA::7}" \
            --notes "Regenerated golden screenshots from ${GITHUB_SHA}."

      - uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: /tmp/goldens/**
          if-no-files-found: error
